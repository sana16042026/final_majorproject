<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | MPLADS Road Monitoring</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:linear-gradient(135deg,#0d3b78,#1a5fb4);min-height:100vh}.signup-card{max-width:460px;border:0;border-radius:14px}</style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
<main class="card signup-card shadow-lg w-100"><div class="card-body p-4">
  <h1 class="h4 fw-bold">Create your account</h1>
  <p class="text-muted small">Sign up as a citizen to browse road projects. Contact an administrator for an official role.</p>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ token }}">
    <div class="mb-3"><label for="full_name" class="form-label">Full name</label><input id="full_name" name="full_name" class="form-control" required maxlength="100" autocomplete="name" value="{{ values.get('full_name','') }}"></div>
    <div class="mb-3"><label for="username" class="form-label">Username</label><input id="username" name="username" class="form-control" required minlength="3" maxlength="50" pattern="[A-Za-z0-9_.\-]{3,50}" autocomplete="username" value="{{ values.get('username','') }}"><div class="form-text">3-50 letters, numbers, dots, underscores or hyphens.</div></div>
    <div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" name="password" type="password" class="form-control" required minlength="8" maxlength="128" autocomplete="new-password"><div class="form-text">Use at least 8 characters.</div></div>
    <div class="mb-3"><label for="confirm_password" class="form-label">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" class="form-control" required minlength="8" maxlength="128" autocomplete="new-password"></div>
    <button class="btn btn-primary w-100" type="submit">Sign Up</button>
  </form>
  <p class="text-center small mt-3 mb-0">Already registered? <a href="{{ url_for('login_page') }}">Log in</a></p>
</div></main>
</body></html>
